<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b070b">
  <meta name="robots" content="noindex">
  <title>Check your status · Panaghimamat 2026</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261014-status">
  <script src="config.js" defer></script>
  <script src="assets/status.js?v=20261014-status" defer></script>
</head>
<body class="status-page">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
    <filter id="deckle" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter>
  </defs></svg>
  <div class="velvet" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="masthead">
      <span class="brand"><img src="assets/sti-logo.png" alt="" width="34" height="34"><strong>STI College Valencia</strong></span>
      <span class="brand brand-right"><strong>Supreme Student Council</strong><img src="assets/ssc-logo.png" alt="Supreme Student Council logo" width="34" height="34"></span>
    </header>
    <main>
      <h1 class="page-title">Check your <em>status</em></h1>
      <p class="lead">Type the email you used in your reply to see where your payment and QR ticket are.</p>
      <form id="statusForm" class="paper paper-card form-card" novalidate>
        <div class="form-field"><label for="statusEmail">Your email</label>
          <div class="name-check" id="emailCheck"><input id="statusEmail" type="email" maxlength="120" autocomplete="email" inputmode="email" placeholder="e.g. stephen.paubapo@gmail.com" required><span class="name-check-status" aria-live="polite"><span class="name-spin" aria-hidden="true"></span><span class="name-ok" aria-hidden="true">✓</span><span id="emailCheckText"></span></span></div>
        </div>
        <p class="form-error" id="statusError" role="alert" hidden></p>
        <button class="primary-btn full" type="submit" id="statusBtn">Check status</button>
      </form>
      <div id="statusResult" aria-live="polite"></div>
      <p class="status-back"><a href="./">← Back to the invitation</a></p>
    </main>
    <p class="footer-mark">Learn · Share · Serve · Create</p>
    <p class="credit">by Julius · 2026</p>
  </div>
</body>
</html>
